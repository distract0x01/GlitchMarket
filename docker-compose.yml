services:
  web:
    image: php:8.2-apache
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    command: >
      bash -c "docker-php-ext-install mysqli && apache2-foreground"
    depends_on:
      - db

  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: glitchmarket
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
